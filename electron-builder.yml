appId: com.kubejs.recipestudio
productName: KubeJS Recipe Studio
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - '!node_modules/**'
  - node_modules/acorn/**
  - node_modules/yauzl/**
  - node_modules/fd-slicer/**
  - node_modules/pend/**
asar: true
win:
  target:
    - nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: KubeJS Recipe Studio
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
